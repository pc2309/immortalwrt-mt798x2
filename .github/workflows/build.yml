name: Build 360T7 ImmortalWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: openwrt-21.02
          fetch-depth: 1

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget ccache

      - name: 缓存 dl 与 ccache
        uses: actions/cache@v4
        with:
          path: |
            dl
            .ccache
          key: ${{ runner.os }}-mt7981-${{ hashFiles('defconfig/mt7981-360-t7-512m.config') }}
          restore-keys: |
            ${{ runner.os }}-mt7981-

      - name: 更新 feeds
        run: |
          echo 'src-git istore https://github.com/linkease/istore.git;main' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install luci-app-store luci-compat

      - name: 拉取 OpenClash
        run: |
          rm -rf package/luci-app-openclash /tmp/OpenClash
          git clone --depth 1 --single-branch https://github.com/vernesong/OpenClash.git /tmp/OpenClash
          cp -r /tmp/OpenClash/luci-app-openclash package/luci-app-openclash
          ls package/luci-app-openclash

      - name: 加载配置
        run: |
          cp defconfig/mt7981-360-t7-512m.config .config
          echo 'CONFIG_PACKAGE_luci-app-store=y' >> .config
          echo 'CONFIG_PACKAGE_luci-compat=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-openclash=y' >> .config
          make defconfig
          grep -q 'CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_mt7981-360-t7-108M=y' .config || { echo '错误：360T7 设备未生效'; grep -n '360' .config; exit 1; }
          grep -c 'CONFIG_PACKAGE_luci-app-openclash=y' .config

      - name: 编译固件
        run: |
          export CCACHE_DIR=$PWD/.ccache
          export CCACHE_MAXSIZE=2G
          set +e
          make -j$(nproc) > build.log 2>&1
          rc=$?
          set -e
          echo "make 退出码: $rc"
          if [ $rc -ne 0 ]; then
            echo '===== 关键错误行 ====='
            grep -n -E "Error [0-9]|error:|\*\*\* |Cannot install|unresolved|ERROR" build.log | tail -n 50 || true
            echo '===== 日志末尾 150 行 ====='
            tail -n 150 build.log
            exit $rc
          fi
          echo '===== 编译完成，产物目录 ====='
          ls -lh bin/targets/mediatek/mt7981/ || true

      - name: 收集固件
        run: |
          mkdir -p artifact
          find bin/targets -type f \( -name '*.bin' -o -name '*.itb' -o -name '*.tar.gz' \) -exec cp -v {} artifact/ \;
          echo "产物数量: $(ls -1 artifact 2>/dev/null | wc -l)"
          ls -lh artifact || true
          if [ -z "$(ls -A artifact)" ]; then
            echo '===== 没有找到任何固件产物，日志末尾 150 行 ====='
            tail -n 150 build.log
            exit 1
          fi

      - name: 上传固件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 360T7-firmware
          path: artifact
          retention-days: 7
          if-no-files-found: warn

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
          if-no-files-found: warn
